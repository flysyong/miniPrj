    len(hits)<=1, hits; print('CONFIG_OK')"
  output_assertion: CONFIG_OK
- description: README에 설치·실행 방법, 구조도, 사용 기술 목록, 평가 실행 방법이 있고, 평가 점수와 분석을 담은 Markdown
