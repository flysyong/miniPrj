constraints:
- Python 3.14, AWS Bedrock 사용
- 임베딩 amazon.titan-embed-text-v2:0, 메인 LLM us.anthropic.claude-sonnet-4-5-20250929-v1:0,
  LLM 판정·가드 검사 global.anthropic.claude-haiku-4-5-20251001-v1:0
- 모델 ID는 코드에 고정하지 않고 설정(.env 등) 한 곳에서 바꿀 수 있어야 함
- 학습용 데모 수준이며 개념과 구현이 단순해야 함
- 파일럿 프로젝트로 1일 이내에 구현 가능한 범위
- 고객이 직접 쓰는 AS 접수 챗봇이며 UI는 Streamlit 웹 채팅
- UI 파일(Streamlit/CLI)에는 배정·라우팅 로직이 없고 그래프만 호출하며, Streamlit 없이 CLI로도 같은 시나리오를 시연할 수 있어야 함
- LLM 호출은 temperature=0으로 고정하고, 검색된 FAQ 본문은 지시문이 아닌 데이터로 구분(구분자로 감싸기)해 프롬프트에 넣음
- 전화번호 형식(010-XXXX-XXXX) 또는 날짜 형식(YYYY-MM-DD)이 틀리면 다시 입력을 요청함
- 하나의 LangGraph 그래프(접수→상담→배정→예약)로 구현. Supervisor 멀티에이전트는 선택 확장
- HITL 승인 = 고객이 방문 일정(기사·날짜)을 최종 확정하는 단계
- RAG 지식 문서는 직접 작성한 가상 증상-조치 FAQ Markdown(제품군별, 30~50건). 실제 제조사 PDF 매뉴얼은 쓰지 않음
- '자가 해결 분기: 조치 안내 후 해결 여부를 묻고, 해결되면 접수 종료, 안 되면 기사 배정으로 진행'
- '기사 배정 규칙: 고객 지역 일치 + 제품군 일치 + 희망 날짜 근무 가능. 후보가 여러 명이면 그날 예약이 가장 적은 기사, 동률이면 기사
  ID 순'
- 기사 명단·근무일·예약은 가상 JSON 파일로 만들고 MCP 도구로 노출
- 고객이 제안을 거절하거나 희망 날짜에 가능한 기사가 없으면, 배정 규칙을 만족하는 가장 빠른 가능 날짜 하루를 기사와 함께 다시 제안. 한 번에
  1개 날짜만 제안하고 재제안은 최대 3회
- 재제안 3회가 모두 거절/실패하면 가능한 기사가 없다고 안내하고, 접수를 '대기' 상태로 저장한 뒤 '추후 연락' 안내로 종료
- 입력 가드레일 차단 대상 = 프롬프트 인젝션, AS 무관 질문(잡담·주식 등), 욕설·폭언. 차단 시 안내 문구를 보내고 대화는 계속
- 개인정보(주민번호·카드번호 등)는 차단하지 않고 로그/LLM 전달 시 마스킹. 전화번호·주소는 차단 대상이 아님
- 동일 고객이 동일 제품으로 방문 완료 전(진행 중)인 접수가 있으면 새 접수를 막고 기존 접수를 안내. 방문 완료된 건은 재접수 허용
- 메모리 = 체크포인터(대화 중 기억) + 접수 이력 JSON 저장(이중 접수 확인용). 고객별 장기 기억은 제외
- 고객 식별은 전화번호. 화면·로그에는 010-****-1234처럼 마스킹해 표시
- 평가 항목은 RAG 답변 정확도(LLM-as-Judge), 기사 배정 정확도, 가드레일 차단율(오차단률 포함) 3가지. 슬롯 추출 정확도는 제외
- 평가 합격 목표치는 정하지 않고 항목별 점수만 측정·출력
- '평가셋은 직접 작성한 JSON: RAG 20건(질문+정답 조치), 기사 배정 15건(지역·제품·날짜+정답 기사 ID), 가드레일 30건(차단
  20 + 정상 10)'
- eval.py 한 번 실행으로 항목별 점수를 콘솔에 출력하고 건별 결과를 CSV로 저장
- LangSmith 등 외부 평가/트레이싱 도구는 사용하지 않음
- 필수 범위 = 5개 데모 시나리오 동작 + eval.py 3개 항목 측정 + 5개 시나리오를 화면 없이 자동 실행·검증하는 scenarios.py
- '시간이 부족할 때 줄이는 순서: 결과 보고서 분석 깊이(점수표만) → BM25 하이브리드 검색(벡터 검색만) → 접수 이력 화면 표시 → Streamlit
  UI(같은 그래프를 쓰는 CLI 데모로 대체)'
acceptance_criteria:
- description: '화면 없이 5개 데모 시나리오가 처음부터 끝까지 자동 실행·검증된다: ①자가 해결 종료 ②정상 예약 확정(규칙에 맞는
    기사·날짜를 고객이 승인) ③3회 거절 후 ''대기'' 저장과 ''추후 연락'' 종료 ④진행 중 접수 중복 차단과 기존 접수 안내 ⑤가드레일
    차단 후 대화 계속. 출력에 전화번호는 마스킹되어 나온다'
  semantic_ac_key: ac_3bdf9f3912307fa6
  verify_command: t=$(mktemp -d) && cp -r . "$t"/ && cd "$t" && python scenarios.py
  expected_artifacts:
  - scenarios.py
- description: eval.py 한 번 실행으로 RAG 답변 정확도(LLM-as-Judge), 기사 배정 정확도, 가드레일 차단율·오차단률이
    콘솔에 출력되고, 건별 결과 CSV가 저장된다. 평가셋 규모는 RAG 20건, 배정 15건, 가드레일 30건이다
  semantic_ac_key: ac_67f983102ba35248
  verify_command: t=$(mktemp -d) && cp -r . "$t"/ && cd "$t" && find . -name '*.csv'
    -delete && python eval.py && python -c "import glob; assert glob.glob('**/*.csv',
    recursive=True); print('CSV_OK')"
  expected_artifacts:
  - eval.py
  output_assertion: CSV_OK
- description: Streamlit 채팅 화면에서 같은 5개 시나리오를 끝까지 시연할 수 있다. 방문 일정 확정은 고객 승인(HITL)으로
    이루어지고, 화면에 표시되는 전화번호는 마스킹된다
  semantic_ac_key: ac_7ec363f76227b395
  verify_exemption_reason: 브라우저에서 사람이 대화를 주고받는 상호작용 시연이라 한 줄 명령으로 판정할 수 없다. 같은 그래프
    로직은 scenarios.py 기준으로 검증된다
- description: 사용하는 Bedrock 모델 ID를 설정 한 곳에서 바꿀 수 있다. 모델 ID 문자열이 Python 소스 여러 곳에 하드코딩되어
    있지 않다
  semantic_ac_key: ac_3c48925c6abab0ba
  verify_command: python -c "import pathlib; ids=['anthropic.claude','titan-embed'];
    hits=[p for p in pathlib.Path('.').rglob('*.py') if '.venv' not in p.parts and
