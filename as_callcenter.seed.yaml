goal: C:\AX-SDS\miniPjt에 Python으로 고객용 전자제품 AS 접수 챗봇 데모를 만든다. 챗봇은 접수를 받고, 증상 기반 RAG로
  상담하며 자가 해결 분기를 둔다. 해결되지 않으면 MCP 도구로 규칙에 따라 기사를 배정하고, 고객이 방문 일정을 승인(HITL)하면 예약을 확정한다.
  화면은 Streamlit 채팅이며, 같은 그래프를 쓰는 CLI로도 시연할 수 있어야 한다. 강의 기술(LangChain, RAG, LangGraph,
  MCP, 메모리, 가드레일, 평가)을 활용하고, eval.py로 RAG 정확도·기사 배정 정확도·가드레일 차단율을 측정한다.
