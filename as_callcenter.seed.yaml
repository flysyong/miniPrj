assumptions:
- eval.py, scenarios.py, README.md는 C:\AX-SDS\miniPjt 루트에 둔다
- 모델 설정 파일은 .env와 커밋용 .env.example 형태이며, 모델 ID 문자열을 담는 Python 모듈은 설정 모듈 하나뿐이다
- '결과 보고서는 README.md가 아닌 별도 Markdown 파일(예: REPORT.md)이다'
- scenarios.py는 기본적으로 실제 Bedrock을 호출하며, 시나리오 하나라도 실패하면 0이 아닌 종료 코드로 끝난다
- 기사 배정은 결정적 규칙이므로 배정 평가 15건은 100% 정답일 것으로 예상하지만, 이것은 합격 기준이 아니다
- 실행·검증 명령은 Bash에서 python 명령이 Python 3.14를 가리킨다고 가정한다
- MCP 서버는 day7_practice처럼 FastMCP 서버(mcp_server.py)로 구성한다
- 벡터스토어는 Chroma를 쓰고, 시간이 허락하면 BM25+kiwipiepy 하이브리드 검색을 더한다
ontology_schema:
  name: ASIntakeCallCenter
  description: 고객 AS 접수부터 증상 상담(RAG), 기사 배정(MCP), 방문 일정 승인(HITL)까지 이어지는 접수 건과, 그에
    관련된 기사·평가 데이터의 도메인 모델
  fields:
  - name: ticket_id
    type: string
    description: 접수 건 식별자
    required: true
  - name: customer_phone
    type: string
    description: 고객 식별용 전화번호(표시·로그에는 마스킹)
    required: true
  - name: address_region
    type: string
    description: 고객 지역(기사 배정 조건)
    required: true
  - name: product_category
    type: string
    description: 제품군(TV/냉장고/세탁기 등)
    required: true
  - name: symptom
    type: string
    description: 고객이 말한 증상
    required: true
  - name: rag_guidance
    type: string
    description: FAQ 검색으로 안내한 자가 조치 내용
    required: true
  - name: self_resolved
    type: boolean
    description: 자가 조치로 해결되었는지 여부
    required: true
  - name: preferred_date
    type: string
    description: 고객 희망 방문 날짜
    required: true
  - name: assigned_technician_id
    type: string
    description: 배정된 기사 ID
    required: true
  - name: visit_date
    type: string
    description: 확정 또는 제안된 방문 날짜
    required: true
  - name: proposal_attempts
    type: number
    description: 재제안 횟수(최대 3)
    required: true
  - name: status
    type: string
    description: 접수 상태(자가해결종료/예약확정/대기/방문완료)
    required: true
  - name: technicians
    type: array
    description: 기사 명단(ID, 지역, 제품군, 근무일, 날짜별 예약 수)
    required: true
  - name: guard_result
    type: object
    description: '입력 가드 판정(차단 여부, 유형: 인젝션/무관/욕설)'
    required: true
  - name: eval_scores
    type: object
    description: RAG 정확도, 배정 정확도, 가드 차단율·오차단률
    required: true
evaluation_principles:
- name: scenario_completeness
  description: 5개 데모 시나리오가 그래프 수준(scenarios.py)과 UI/CLI에서 끝까지 동작한다
  weight: 0.3
- name: rule_fidelity
  description: 배정 규칙, 재제안 최대 3회, 대기 저장, 중복 접수 차단, 가드 차단 범위가 인터뷰 결정과 정확히 일치한다
  weight: 0.25
- name: measurable_evaluation
  description: eval.py가 3개 항목 점수와 건별 CSV를 재현 가능하게 만든다
  weight: 0.2
- name: simplicity
  description: 초보자가 이해할 수 있는 단순한 단일 그래프 구조이며, 강의 실습 코드 패턴을 재사용한다
  weight: 0.15
- name: privacy_and_config
  description: PII와 전화번호가 마스킹되고, 모델 ID는 설정 한 곳에서 바뀐다
  weight: 0.1
exit_conditions:
- name: all_required_done
  description: 필수 범위가 모두 충족됨
  criteria: scenarios.py 5개 시나리오 통과 + eval.py 3개 항목 점수 출력·CSV 저장 + README와 결과 보고서
    존재
- name: time_box_reached
  description: 1일 시간 한도 도달
  criteria: 정해진 축소 순서(보고서 깊이 → BM25 → 이력 화면 → Streamlit을 CLI로 대체)를 적용한 뒤에도 필수 범위가
    충족된 상태로 종료
- name: blocked_by_model_access
  description: Bedrock 모델 접근 불가
  criteria: 설정에서 다른 Bedrock 모델로 바꿔도 실행할 수 없으면 중단하고 보고
